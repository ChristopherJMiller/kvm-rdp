name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Duplicate-dependency check (informational in Plan A)
        run: |
          # Plan A has no IronRDP dependency, so this only prints duplicates.
          # Plan C turns it into a hard gate that fails on a duplicate
          # ironrdp-* crate (spec §4.2). Until then it must not fail CI.
          cargo tree --workspace --duplicates || true
      - name: No ring in the dependency graph (spec §4.2)
        run: |
          # aws-lc-rs is the one crypto provider; nothing may pull in ring.
          # `cargo tree -i ring` exits 0 with "nothing to print" when ring
          # is in Cargo.lock but never activated (it is: an optional
          # dependency of rustls-webpki), and exits non-zero with "did not
          # match any packages" when it is not in Cargo.lock at all. Both
          # mean "absent", so the gate is on the printed tree, not the exit
          # code: any tree on stdout fails CI.
          set +e
          tree=$(cargo tree --workspace --target all -i ring 2>"$RUNNER_TEMP/ring.err")
          rc=$?
          set -e
          if [ -n "$tree" ]; then
            echo "::error::ring is in the dependency graph (spec §4.2 forbids it):"
            echo "$tree"
            exit 1
          fi
          if [ "$rc" -ne 0 ] && ! grep -q 'did not match any packages' "$RUNNER_TEMP/ring.err"; then
            cat "$RUNNER_TEMP/ring.err"
            exit "$rc"
          fi
          echo "ring: not in the dependency graph"
      - name: kvm-proto/fuzzing stays out of the workspace graph (Plan B D8)
        run: |
          # kvm_proto::fuzzing panics by design; only fuzz/ (its own
          # workspace) may enable the feature. --all-features above compiles
          # it for clippy and the seed tests; this checks no crate asks for it.
          if cargo tree --workspace -e features -i kvm-proto | grep -q 'feature "fuzzing"'; then
            echo "::error::a workspace crate enables kvm-proto's fuzzing feature (Plan B D8)"
            exit 1
          fi

  fuzz:
    # Bounded fuzzing of kvm-proto (spec §11.2, §13 — CI only): every target
    # for 5 s, RSS-capped by scripts/fuzz.sh. Longer runs are the nightly
    # workflow's.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-01
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Seeds, on stable (rust-toolchain.toml)
        run: scripts/fuzz.sh seeds
      - name: Fuzz every target for 5 s
        env:
          FUZZ_CARGO: cargo +nightly-2026-10-01
        run: scripts/fuzz.sh run 5
      - name: Keep any crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
