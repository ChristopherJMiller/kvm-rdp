name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only for every job but `publish` (Plan E Task 4.2), which asks for its
# own permissions and runs only on a push to main; no job reads a secret on a
# pull request, so a fork's PR runs every gate safely. Every action is pinned
# to a commit SHA with its tag beside it (scripts/check-workflows.sh; bump
# with scripts/pin-action.sh). Rust comes from rustup on the runner image,
# reading rust-toolchain.toml; every other tool from the flake (DE13).
permissions:
  contents: read

# A newer push to the same PR supersedes the run in flight: IronRDP's graph
# is too heavy to build twice for nothing (§13). Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # ubuntu-24.04 has 4 vCPUs; .cargo/config.toml's RUST_TEST_THREADS = 4
  # matches it, and L2's one-sided timing asserts are sized for that.
  CARGO_BUILD_JOBS: "4"

jobs:
  check:
    runs-on: ubuntu-24.04
    # IronRDP's graph plus L2 (§13): a hung L2 case must not hold a runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes git: the token is not left on disk while the
          # repository's own code runs (check-workflows.sh rule 10).
          persist-credentials: false
      - name: Rust from rust-toolchain.toml (1.94.1 with clippy and rustfmt)
        run: rustup toolchain install && cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # One dependency cache, written by main only: pull requests
          # restore it and never save their own (the nightly reads it too).
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The cheap gates first: none of them compiles anything.
      - name: Format
        run: cargo fmt --all -- --check
      - name: No secrets or captures tracked (owner rule; spec §9.2, §11.5)
        # A backstop, not a guarantee: it gates on names only, so a secret
        # under an innocent name (`nla.password`, `key.pem.bak`) still
        # passes. -z and quotePath=false keep non-ASCII paths unquoted (or
        # `$` never meets the extension); -i catches `tls.PEM`; captures/
        # is refused at any depth, and .superpowers/ (excluded only by a
        # local .git/info/exclude) if anyone force-adds it.
        run: |
          bad=$(git -c core.quotePath=false ls-files -z \
            | grep -zEi '\.(pem|key|pass|p12|pfx|der|pcap|pcapng|rdp)$|(^|/)captures/|^\.superpowers/' \
            | tr '\0' '\n' || true)
          if [ -n "$bad" ]; then
            echo "::error::secret-shaped or capture files are tracked:"
            echo "$bad"
            exit 1
          fi
          echo "no secrets or captures tracked"
      - name: No duplicate ironrdp-* crate (spec §4.2)
        run: |
          set +e
          tree=$(cargo tree --workspace --target all -d --depth 0 --prefix none 2>"$RUNNER_TEMP/dups.err")
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::cargo tree failed while checking for duplicate ironrdp-* crates (spec §4.2):"
            cat "$RUNNER_TEMP/dups.err"
            exit "$rc"
          fi
          dups=$(printf '%s\n' "$tree" | grep -E '^ironrdp' || true)
          if [ -n "$dups" ]; then
            echo "::error::duplicate ironrdp-* crates (spec §4.2 pins one rev):"
            echo "$dups"
            exit 1
          fi
          echo "ironrdp: one version of every crate"
      - name: No ring in the dependency graph (spec §4.2)
        run: |
          # aws-lc-rs is the one crypto provider; nothing may pull in ring.
          # `cargo tree -i ring` exits 0 with "nothing to print" when ring
          # is in Cargo.lock but never activated (it is: an optional
          # dependency of rustls-webpki), and exits non-zero with "did not
          # match any packages" when it is not in Cargo.lock at all. Both
          # mean "absent", so the gate is on the printed tree, not the exit
          # code: any tree on stdout fails CI.
          set +e
          tree=$(cargo tree --workspace --target all -i ring 2>"$RUNNER_TEMP/ring.err")
          rc=$?
          set -e
          if [ -n "$tree" ]; then
            echo "::error::ring is in the dependency graph (spec §4.2 forbids it):"
            echo "$tree"
            exit 1
          fi
          if [ "$rc" -ne 0 ] && ! grep -q 'did not match any packages' "$RUNNER_TEMP/ring.err"; then
            cat "$RUNNER_TEMP/ring.err"
            exit "$rc"
          fi
          echo "ring: not in the dependency graph"
      - name: kvm-proto/fuzzing stays out of the workspace graph (Plan B D8)
        run: |
          # kvm_proto::fuzzing panics by design; only fuzz/ (its own
          # workspace) may enable the feature. --all-features below compiles
          # it for clippy and the seed tests; this checks no crate asks for
          # it, on any platform (--target all catches a target-specific
          # dependency a host-only tree misses), and fails outright if
          # `cargo tree` itself errors rather than failing open (fix round 1,
          # m1/m2).
          set +e
          tree=$(cargo tree --workspace --target all -e features -i kvm-proto 2>"$RUNNER_TEMP/fuzzing.err")
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::cargo tree failed while checking for kvm-proto's fuzzing feature (Plan B D8):"
            cat "$RUNNER_TEMP/fuzzing.err"
            exit "$rc"
          fi
          if echo "$tree" | grep -q 'feature "fuzzing"'; then
            echo "::error::a workspace crate enables kvm-proto's fuzzing feature (Plan B D8)"
            echo "$tree"
            exit 1
          fi
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy — the image's feature set
        # The build that ships has neither test-hooks nor alloc-stats: an
        # item gated on them must leave no unused import behind (Docker
        # does not deny warnings).
        run: cargo clippy -p kvm-rdp --lib --bins -- -D warnings
      - name: Test
        # Unit, L1 and L2 (the bridge, kvm-sim and an IronRDP client on
        # private loopback addresses in 127.128.0.0/10 — Linux routes all of
        # 127/8 to lo) and the real binary under SIGTERM.
        run: cargo test --workspace --all-features
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: L3 tools from the flake (FreeRDP 3.32.1 with OpenH264, xvfb-run)
        run: |
          nix build .#l3-tools --out-link "$RUNNER_TEMP/l3-tools"
          "$RUNNER_TEMP/l3-tools/bin/xfreerdp" /version
      - name: Drop the job token nix.conf now holds
        # As in `lint`: install-nix-action writes `access-tokens =
        # github.com=$GITHUB_TOKEN` into nix.conf with no way for the caller
        # to unset it; nothing after this step needs it, and the
        # repository's own code (L3, the budget script) runs next.
        run: sudo sed -i '/^access-tokens/d' /etc/nix/nix.conf
      - name: L3 interop (spec §11.4) — FreeRDP against the bridge, one case at a time
        # Four cases of well under a minute each: a hung FreeRDP or Xvfb
        # must not spend the job's 45 minutes.
        timeout-minutes: 10
        run: |
          export PATH="$RUNNER_TEMP/l3-tools/bin:$PATH"
          cargo test --workspace --all-features --test l2 -- --ignored l3:: --test-threads 1
      - name: Target budget (spec §13, DC10)
        run: scripts/target-budget.sh

  fuzz:
    # Bounded fuzzing of kvm-proto (spec §11.2, §13 — CI only): every target
    # for 5 s, RSS-capped by scripts/fuzz.sh. Longer runs are the nightly's.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (stable from rust-toolchain.toml; the fuzz nightly)
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-10-01 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Seeds, on stable (rust-toolchain.toml)
        run: scripts/fuzz.sh seeds
      - name: Fuzz every target for 5 s
        env:
          FUZZ_CARGO: cargo +nightly-2026-10-01
        run: scripts/fuzz.sh run 5
      - name: Keep any crash
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  lint:
    # Plan E Task 2.1: the workflows' own rules (check-workflows.sh), the
    # scripts, the disk pass; Task 2.2: cargo deny over the production graph
    # (deny.toml).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: The flake's lint tools (cargo-deny, actionlint, shellcheck, yq)
        run: |
          nix build .#lint-tools --out-link "$RUNNER_TEMP/lint-tools"
          echo "$RUNNER_TEMP/lint-tools/bin" >> "$GITHUB_PATH"
      - name: Drop the job token nix.conf now holds
        # install-nix-action writes `access-tokens = github.com=$GITHUB_TOKEN`
        # into nix.conf with no way for the caller to unset it; nothing after
        # this step needs it, and the repository's own scripts run next
        # (PE5 review m1).
        run: sudo sed -i '/^access-tokens/d' /etc/nix/nix.conf
      - name: Workflow and image-pin rules
        run: scripts/test-check-workflows.sh && scripts/check-workflows.sh
      - name: actionlint
        run: actionlint
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: Rust for cargo deny (cargo metadata; rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo deny — licences, bans, sources (the production graph)
        run: cargo deny --locked check bans licenses sources
      - name: cargo deny — advisories (blocking on main; reported on PRs, DE15)
        # The advisory database moves daily: on a PR a new advisory is
        # reported, not a red gate on a change that did not cause it. On
        # main it blocks, so `publish` (which needs `lint`) never ships a
        # known-vulnerable image. The nightly's deny-advisories job reports
        # it every night (Task 2.3).
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: cargo deny --locked check advisories
      - name: The target-budget script (the disk pass)
        run: scripts/test-target-budget.sh

  image:
    outputs:
      # The archive's manifest digest, for `publish` to compare with the push.
      digest: ${{ steps.digest.outputs.digest }}
    # Plan E Task 4.2: this commit's image, built reproducibly and smoke-tested
    # (scripts/image-build.sh, scripts/image-smoke.sh). On main its OCI
    # archive is what `publish` pushes — the tested bytes, never a rebuild.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (an OCI archive, and the same image loaded as kvm-rdp:ci)
        run: scripts/image-build.sh "$RUNNER_TEMP/kvm-rdp.oci.tar"
      - name: The tested archive's manifest digest
        id: digest
        run: |
          digest=$(tar -xOf "$RUNNER_TEMP/kvm-rdp.oci.tar" index.json | jq -r '.manifests[0].digest')
          case $digest in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "::error::no manifest digest in the archive: $digest"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: scripts/image-smoke.sh kvm-rdp:ci
      - name: Keep the tested archive for publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kvm-rdp-image
          path: ${{ runner.temp }}/kvm-rdp.oci.tar
          retention-days: 3
          if-no-files-found: error

  bench:
    # §10.2: kvm-bench on every PR at loose (10×) thresholds — release builds
    # of the bridge under test (alloc-stats, test-hooks) and of kvm-bench,
    # the bench streams from the flake's ffmpeg, and the `ci` set.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust from rust-toolchain.toml
        run: rustup toolchain install && cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Bench tools from the flake (ffmpeg, jq)
        run: |
          nix build .#bench-tools --out-link "$RUNNER_TEMP/bench-tools"
          echo "$RUNNER_TEMP/bench-tools/bin" >> "$GITHUB_PATH"
      - name: Drop the job token nix.conf now holds
        # As in `check` and `lint`: install-nix-action writes `access-tokens =
        # github.com=$GITHUB_TOKEN` into nix.conf; nothing after this step
        # needs it, and the repository's own code runs next.
        run: sudo sed -i '/^access-tokens/d' /etc/nix/nix.conf
      - name: Bench streams (§10.2 — generated, never committed)
        run: scripts/gen-fixtures.sh bench
      - name: Release builds — the bridge under test, and kvm-bench
        run: |
          cargo build --release --locked -p kvm-rdp --features alloc-stats,test-hooks --bin kvm-rdp
          cargo build --release --locked -p kvm-bench --bin kvm-bench
      - name: kvm-bench — the ci set, loose thresholds
        run: target/release/kvm-bench --bridge target/release/kvm-rdp --thresholds ci --out "$RUNNER_TEMP/kvm-bench" ci
      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kvm-bench-reports
          path: ${{ runner.temp }}/kvm-bench
          retention-days: 14

  publish:
    # The one job with write permissions (design decision 10): a push to main,
    # after every gate. It runs no repository code — no checkout, no flake
    # (DE13's exception; check-workflows rule 12): only pinned actions, and
    # the runner image's skopeo, docker and gh, on the archive the `image`
    # job tested.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, fuzz, lint, image, bench]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/christopherjmiller/kvm-rdp
      # What a verifier must see in the signing certificate (the README's
      # literal values): this workflow, on main.
      IDENTITY: https://github.com/ChristopherJMiller/kvm-rdp/.github/workflows/ci.yml@refs/heads/main
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kvm-rdp-image
          path: ${{ runner.temp }}
      # Before the push: a failed install must not leave an unsigned tag.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Explicit: v3 signs in the new bundle format, which a v2 verifier
          # cannot find (the README says "cosign v3 or later").
          cosign-release: v3.0.6
      - name: Push the tested archive as sha-<short>, digests preserved
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The manifest digest the `image` job read from the archive it
          # smoke-tested, passed on as a job output.
          TESTED: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kvm-rdp.oci.tar"
          tag="$IMAGE:sha-${GITHUB_SHA::7}"
          # One login for skopeo, cosign and attest: attest reads only
          # ~/.docker/config.json, and skopeo falls back to it.
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          skopeo copy --preserve-digests --format oci --digestfile "$RUNNER_TEMP/digest" \
            "oci-archive:$archive" "docker://$tag"
          pushed=$(cat "$RUNNER_TEMP/digest")
          if [ -z "$TESTED" ] || [ "$pushed" != "$TESTED" ]; then
            echo "::error::pushed $pushed, but the image job tested ${TESTED:-nothing}"
            exit 1
          fi
          echo "digest=$pushed" >> "$GITHUB_OUTPUT"
          {
            echo "### Published"
            echo
            echo "\`$tag@$pushed\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # Quoted: a plain YAML scalar cannot hold ": " (the colon after keyless).
      - name: "Sign the digest (keyless: this workflow's identity on main)"
        env:
          # A step output reaches the script as data, never as script text.
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # A user-owned repository: no artifact-metadata storage record
          # (which would need a fifth permission).
          create-storage-record: false
      - name: Verify what was just published, as the README tells a consumer to
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" >/dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo ChristopherJMiller/kvm-rdp \
            --cert-identity "$IDENTITY" \
            --cert-oidc-issuer "$ISSUER" \
            --deny-self-hosted-runners >/dev/null
          echo "signature and provenance verify against $IDENTITY"
