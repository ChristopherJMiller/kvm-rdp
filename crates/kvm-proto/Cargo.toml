[package]
name = "kvm-proto"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false

[lib]
doctest = false

[features]
# Fuzz-target bodies with output invariants (`kvm_proto::fuzzing`), for
# `fuzz/` only: the module panics by design (Plan B deviation D8), and CI
# fails if any workspace crate enables this feature.
fuzzing = []

[dependencies]
bytes = { workspace = true }
h264-reader = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
serde_json = { workspace = true }
proptest = { workspace = true }

[[test]]
name = "fixtures"
path = "tests/fixtures.rs"

[[example]]
name = "fuzz_seeds"
required-features = ["fuzzing"]
