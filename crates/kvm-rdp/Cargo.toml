[package]
name = "kvm-rdp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false

[lib]
name = "kvm_rdp"
path = "src/lib.rs"
doctest = false

# No unit tests in the binary: a third IronRDP-linked test executable would
# cost a link and its disk (§13). L2's secrets case runs it as a subprocess.
[[bin]]
name = "kvm-rdp"
path = "src/main.rs"
test = false
bench = false

[features]
# Test seams the release image must not carry (Plan E Task 1.1, DE6): the
# RDP-runtime stall behind `BridgeHandle::block_rdp_runtime_for` (L2's
# /livez case), the pump shell's injected panic, and the `[test]
# panic_after` key that fires it (§5.2's panic path, in debug and in
# release). Every test build turns it on through the dev-dependency on this
# package below; `cargo build --release -p kvm-rdp` (the image) never does.
test-hooks = []

[dependencies]
kvm-proto = { path = "../kvm-proto" }
ironrdp-server = { workspace = true }
ironrdp-egfx = { workspace = true }
ironrdp-dvc = { workspace = true }
ironrdp-svc = { workspace = true }
ironrdp-pdu = { workspace = true }
ironrdp-core = { workspace = true }
ironrdp-cliprdr = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
# Already in the graph through tokio and hyper-util: SO_LINGER for the
# websocket's abortive close (PC9 fix round 1, I2).
socket2 = "0.6"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
x509-parser = "0.16"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "registry", "std"] }

[dev-dependencies]
kvm-sim = { path = "../kvm-sim" }
ironrdp-graphics = { workspace = true }
ironrdp-connector = { workspace = true }
ironrdp-async = { workspace = true }
ironrdp-tokio = { workspace = true, features = ["reqwest"] }
ironrdp-tls = { workspace = true, features = ["rustls"] }
ironrdp-session = { workspace = true }
# default features would pull in ring (rcgen 0.13's default backend, §4.2)
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"
# raise(3) for the P37 signal-order test (Task 6.1's L2 uses kill(2)).
libc = "0.2"
# `start_paused` tests; without it `cargo test -p kvm-rdp` only builds
# through workspace feature unification (kvm-sim enables test-util).
tokio = { version = "1", features = ["test-util"] }
# Turns `test-hooks` on for the lib's unit tests, L2 and the binary L2
# spawns. Dev-dependency features never reach a non-test build (resolver 3).
kvm-rdp = { path = ".", features = ["test-hooks"] }

# The one integration-test binary (§13): every L2 case links here. `libc`
# (L2's SIGTERM to the real binary, Task 6.6) is already a dev-dependency
# above — it must stay in [dev-dependencies], never in this table (P39).
[[test]]
name = "l2"
path = "tests/l2/main.rs"
