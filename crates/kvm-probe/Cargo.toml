[package]
name = "kvm-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false
autotests = false

[lib]
name = "kvm_probe"
path = "src/lib.rs"

[[bin]]
name = "kvm-probe"
path = "src/main.rs"

[[test]]
name = "stubs"
path = "tests/stubs/main.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-pki-types = "1"
x509-parser = "0.16"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
kvm-proto = { path = "../kvm-proto" }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }  # default features would pull in ring (§4.2)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "test-util"] }
bytes = { workspace = true }
tempfile = "3"

[lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
