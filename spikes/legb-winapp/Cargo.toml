[package]
name = "legb-winapp"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT OR Apache-2.0"

# Empty workspace table: keeps this crate OUT of any parent workspace.
[workspace]

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-std", "io-util"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
# default features pull in `ring` (rcgen 0.13's default crypto backend);
# swap to aws_lc_rs so ring never enters the tree (spec §4.2, matches
# crates/kvm-probe/Cargo.toml's rcgen dev-dependency).
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
x509-cert = "0.3"
bytes = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Pin transitive picky-krb to the version IronRDP 38b074e's own Cargo.lock
# uses (0.12.4). 0.12.5 added a new GssApiMessageError variant that sspi
# 0.21.3's exhaustive match doesn't handle yet (upstream semver skew between
# sspi and picky-krb) — without this pin the build fails with E0004.
picky-krb = "=0.12.4"

ironrdp-server = { git = "https://github.com/Devolutions/IronRDP.git", rev = "38b074e", default-features = false, features = ["egfx", "helper"] }
ironrdp-egfx   = { git = "https://github.com/Devolutions/IronRDP.git", rev = "38b074e" }
ironrdp-dvc    = { git = "https://github.com/Devolutions/IronRDP.git", rev = "38b074e" }
ironrdp-svc    = { git = "https://github.com/Devolutions/IronRDP.git", rev = "38b074e" }
ironrdp-pdu    = { git = "https://github.com/Devolutions/IronRDP.git", rev = "38b074e" }
